<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Formulaire Création Utilisateur</title>
  <style>
    .error-message {
      display: none; /* Masque les messages d'erreur par défaut */
      color: red;
      font-weight: bold;
      margin-top: 5px;
    }
    *@font-face {
      font-family: 'SauceBarbe';
      src: url(font/SauceBarbe.TTF) format('truetype');
    }
    .custom-font, body {
      font-family: SauceBarbe;
      color: white;
    }
  </style>
</head>

<body>
<form id="registerForm" action="../../PHP/authentification.php" method="POST">
  <label for="nom">Nom :</label><br>
  <input type="text" id="nom" name="nom" required><br><br>

  <label for="pseudo">Pseudonyme :</label><br>
  <input type="text" id="pseudo" name="pseudo" required><br>
  <span id="pseudo-error" class="error-message">Ce pseudonyme est déjà pris.</span>
  <br>

  <label for="email">Email :</label><br>
  <input type="email" id="email" name="email" required><br>
  <span id="email-error" class="error-message">Cet email est déjà utilisé.</span>
  <br>

  <label for="password">Mot de passe :</label><br>
  <input type="password" id="password" name="password" required><br><br>

  <button id="submitBtn" type="submit" name="create" style="background: none; border: none; background-image: url('UI/UIButton.png'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; display: block; margin: 0 auto; width: 200px; height: 50px; color: white;">Créer un compte</button>
  <button id="cancelBtn" type="button" onclick="window.location.href='../../homePage.php'" style="background: none; border: none; background-image: url('UI/UIButton.png'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; display: block; margin: 0 auto; width: 200px; height: 50px; color: white;">Annuler</button>
</form>

<script>
  const pseudoInput = document.querySelector("#pseudo");
  const emailInput = document.querySelector("#email");
  const submitBtn = document.querySelector("#submitBtn");

  let isPseudoValid = false;
  let isEmailValid = false;

  // Vérifie si le champ est vide, masque l'erreur si c'est le cas
  pseudoInput.addEventListener("input", () => {
    if (pseudoInput.value.trim() === "") {
      document.getElementById("pseudo-error").style.display = 'none';
    }
  });

  emailInput.addEventListener("input", () => {
    if (emailInput.value.trim() === "") {
      document.getElementById("email-error").style.display = 'none';
    }
  });

  // Écouteurs pour la vérification des doublons
  pseudoInput.addEventListener("keyup", () => {
    checkAvailability("pseudo", pseudoInput.value, (isAvailable) => {
      isPseudoValid = isAvailable;
      updateSubmitButtonState();
    });
  });

  emailInput.addEventListener("keyup", () => {
    checkAvailability("email", emailInput.value, (isAvailable) => {
      isEmailValid = isAvailable;
      updateSubmitButtonState();
    });
  });

  function checkAvailability(type, value, callback) {
    // Si la valeur est vide, masquer l'erreur
    const errorElement = document.getElementById(`${type}-error`);
    if (!value.trim()) {
      errorElement.style.display = 'none';
      callback(false);
      return;
    }

    fetch(`../../PHP/checkAvailability.php?type=${type}&value=${encodeURIComponent(value)}`)
      .then(response => response.text())
      .then(rawText => {
        const data = JSON.parse(rawText.trim());
        if (data.exists) {
          errorElement.style.display = 'inline';
          callback(false);
        } else {
          errorElement.style.display = 'none';
          callback(true);
        }
      }).catch(err => console.error(err));
  }

  function updateSubmitButtonState() {
    submitBtn.disabled = !(isPseudoValid && isEmailValid);
  }
</script>
</body>
</html>
